    <script>
      // Aggressive fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when external scripts try to polyfill fetch in a restricted environment.
      (function() {
        try {
          var originalFetch = window.fetch;
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (descriptor && descriptor.configurable) {
            delete window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } else if (descriptor && !descriptor.set) {
            // If it's not configurable, we try to add a setter if possible to prevent the error
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { console.warn('Prevented fetch override attempt'); },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // If all else fails, we just log it
          console.warn('Fetch protection failed', e);
        }
      })();
    </script>
